services:
  postgres:
    image: postgres:16-alpine
    container_name: codearena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codearena_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - codearena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codearena-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - codearena_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codearena_pgdata:
  codearena_redisdata:
