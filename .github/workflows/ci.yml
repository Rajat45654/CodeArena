name: CodeArena CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://codearena:codearena_secret@localhost:5433/codearena_db?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: codearena_super_secret_jwt_access_key_change_in_production_32chars
      JWT_REFRESH_SECRET: codearena_super_secret_jwt_refresh_key_change_in_production_32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena_secret
          POSTGRES_DB: codearena_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U codearena -d codearena_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Seed Database for Integration Tests
        run: npm run db:seed --workspace=@codearena/api

      - name: Typecheck Shared Packages
        run: |
          npm run build --workspace=@codearena/shared-types
          npm run build --workspace=@codearena/validation

      - name: Run Tests
        run: npm run test --workspaces --if-present -- --runInBand
